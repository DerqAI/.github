name: Notify derq-edge-manifests (reusable)

# Central dispatch for all upstream repos. Call from a thin workflow on push to
# staging (integration) or main (production). Caller needs EDGE_MANIFESTS_TOKEN only.
#
# Maps branch → repository_dispatch event on derq-edge-manifests:
#   staging → repo-updated      → update-manifests.yml (pre-staging track)
#   main    → repo-updated-main → update-manifests-pre-main.yml (pre-main track)

on:
  workflow_call:
    inputs:
      manifest_repo:
        description: "Manifest repository owner/name"
        required: false
        type: string
        default: "derqai/derq-edge-manifests"
    secrets:
      EDGE_MANIFESTS_TOKEN:
        required: true

jobs:
  notify:
    runs-on: ubuntu-latest
    concurrency:
      group: manifest-dispatch-${{ github.repository }}-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - name: Map branch to repository_dispatch event
        id: map
        run: |
          set -euo pipefail
          ref="${{ github.ref_name }}"
          case "$ref" in
            staging) event_type="repo-updated" ;;
            main)    event_type="repo-updated-main" ;;
            *)
              echo "ERROR: branch '${ref}' is not wired for manifest notify (expected staging or main)." >&2
              exit 1
              ;;
          esac
          echo "event_type=${event_type}" >> "$GITHUB_OUTPUT"
          echo "Dispatching ${event_type} for ${{ github.repository }}@${ref}"

      - name: repository_dispatch → derq-edge-manifests
        env:
          TOKEN: ${{ secrets.EDGE_MANIFESTS_TOKEN }}
          MANIFEST_REPO: ${{ inputs.manifest_repo }}
          EVENT_TYPE: ${{ steps.map.outputs.event_type }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          owner="${MANIFEST_REPO%%/*}"
          name="${MANIFEST_REPO##*/}"
          body=$(jq -n \
            --arg et "$EVENT_TYPE" \
            --arg repo "$REPO" \
            --arg sha "$SHA" \
            --arg ref "$REF" \
            '{event_type: $et, client_payload: {repo: $repo, sha: $sha, ref: $ref}}')
          http=$(curl -sS -o /tmp/dispatch.json -w "%{http_code}" -X POST \
            -H "Authorization: token ${TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${owner}/${name}/dispatches" \
            -d "$body")
          if [ "$http" != "204" ]; then
            echo "ERROR: repository_dispatch failed (HTTP ${http})" >&2
            cat /tmp/dispatch.json >&2 || true
            exit 1
          fi
          echo "OK: ${EVENT_TYPE} accepted by ${MANIFEST_REPO}"
